version: 1.0.0
title: Diagnosing and fixing goose extension type errors
description: A recipe for diagnosing why goose extensions fail to load and correcting malformed config entries.
instructions: When goose extensions silently fail to load, inspect the user's config.yaml and check logs for 'unknown variant' errors listing the accepted extension types. Verify accepted values (e.g. streamable_http, stdio, sse, builtin, platform) against the official goose docs before recommending a fix, then apply the corrected type values. Also audit common dev tools availability when relevant. Restart goose after config changes to load the fixed extensions.
