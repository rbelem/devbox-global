# herdr config — Kanagawa Wave theme, vi keys, tmux-style behavior
onboarding = false

[theme]
name = "kanagawa"

[ui]
# don't prompt for a tab name on every new tab
prompt_new_tab_name = false
# mirror ~/.tmux.conf.local: "set -g mouse on"
mouse_capture = true
# mirror tmux_conf_copy_to_os_clipboard=true
copy_on_select = true

[keys]
# tmux-style prefix (matches ~/.tmux.conf: set -g prefix C-a)
prefix = "ctrl+a"

# vi movement — matches tmux prefix+h/j/k/l
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

# swap panes vi-style
swap_pane_left  = "prefix+shift+h"
swap_pane_down  = "prefix+shift+j"
swap_pane_up    = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# tabs: previous/next (ctrl+h / ctrl+l to avoid clashing with pane focus h/l)
previous_tab = "prefix+ctrl+h"
next_tab     = "prefix+ctrl+l"

# tmux-style detach (default is prefix+q; plain prefix+d is free)
detach = "prefix+d"

# navigate-mode vi keys (no prefix)
navigate_pane_left  = "h"
navigate_pane_down  = "j"
navigate_pane_up    = "k"
navigate_pane_right = "l"

# workspace picker (prefix+w): vim j/k to move selection
navigate_workspace_down = "j"
navigate_workspace_up   = "k"

# agents: next/previous (prefix+n/p — free since tabs moved to prefix+ctrl+h/l)
next_agent     = "prefix+n"
previous_agent = "prefix+p"

# herdr-navigator plugin: fuzzy jump to workspaces/agents/sessions/remotes
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"
