GOOSE_MODE: auto
GOOSE_CLI_MIN_PRIORITY: 0.5
OPENAI_HOST: http://localhost:20128
OPENAI_BASE_PATH: /v1
OPENAI_API_KEY: omniroute-local
extensions:
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
  computercontroller:
    enabled: true
    type: builtin
    name: computercontroller
    description: ''
    display_name: null
    timeout: null
    bundled: null
  memory:
    enabled: true
    type: builtin
    name: memory
    description: ''
    display_name: null
    timeout: null
    bundled: null
  context7:
    enabled: true
    type: streamable_http
    name: context7
    uri: https://mcp.context7.com/mcp
    headers:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
  gh_grep:
    enabled: true
    type: streamable_http
    name: gh_grep
    uri: https://mcp.grep.app
  wigolo:
    enabled: true
    type: streamable_http
    name: wigolo
    uri: http://127.0.0.1:3333/mcp
  chrome-devtools:
    enabled: true
    type: stdio
    name: chrome-devtools
    description: ''
    cmd: bunx
    args:
    - -y
    - chrome-devtools-mcp@latest
    - --autoConnect
    envs: {}
    env_keys: []
    timeout: null
    cwd: null
    bundled: null
  tmux:
    enabled: false
    type: stdio
    name: tmux
    description: ''
    cmd: uvx
    args:
    - libtmux-mcp
    envs:
      LIBTMUX_SAFETY: read+send
    env_keys: []
    timeout: null
    cwd: null
    bundled: null
  opencode-docs:
    enabled: true
    type: stdio
    name: opencode-docs
    description: ''
    cmd: bunx
    args:
    - -y
    - opencode-docs-mcp@latest
    envs: {}
    env_keys: []
    timeout: null
    cwd: null
    bundled: null
  agentmemory:
    enabled: true
    type: stdio
    name: agentmemory
    description: ''
    cmd: agentmemory
    args:
    - mcp
    envs: {}
    env_keys: []
    timeout: null
    cwd: null
    bundled: null
  codegraph:
    enabled: true
    type: stdio
    name: codegraph
    description: ''
    cmd: codegraph
    args:
    - serve
    - --mcp
    envs: {}
    env_keys: []
    timeout: 600000
    cwd: null
    bundled: null
  omniroute:
    enabled: false
    type: stdio
    name: omniroute
    description: ''
    cmd: omniroute
    args:
    - --mcp
    envs:
      PRICING_SYNC_ENABLED: 'true'
      PRICING_SYNC_SOURCES: litellm
      PRICING_SYNC_INTERVAL: '86400'
    env_keys: []
    timeout: null
    cwd: null
    bundled: null
  browsermcp:
    enabled: false
    type: stdio
    name: browsermcp
    description: ''
    cmd: bunx
    args:
    - -y
    - '@browsermcp/mcp@latest'
    envs: {}
    env_keys: []
    timeout: null
    cwd: null
    bundled: null
  figma:
    enabled: false
    type: stdio
    name: figma
    description: ''
    cmd: bunx
    args:
    - -y
    - figma-developer-mcp
    - --figma-api-key=${FIGMA_API_KEY}
    - --stdio
    envs: {}
    env_keys: []
    timeout: null
    cwd: null
    bundled: null
  brave-search:
    enabled: false
    type: stdio
    name: brave-search
    description: ''
    cmd: bunx
    args:
    - -y
    - '@brave/brave-search-mcp-server'
    envs:
      BRAVE_API_KEY: ${BRAVE_API_KEY}
    env_keys: []
    timeout: null
    cwd: null
    bundled: null
  openrouter:
    enabled: false
    type: streamable_http
    name: openrouter
    uri: https://mcp.openrouter.ai/mcp
  firecrawl-mcp:
    enabled: false
    type: stdio
    name: firecrawl-mcp
    description: ''
    cmd: bunx
    args:
    - -y
    - firecrawl-mcp
    envs:
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
    env_keys: []
    timeout: null
    cwd: null
    bundled: null
  docling:
    enabled: false
    type: stdio
    name: docling
    description: ''
    cmd: docling-mcp-server
    args:
    - --transport
    - stdio
    envs: {}
    env_keys: []
    timeout: null
    cwd: null
    bundled: null
  summarize:
    enabled: false
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
  scheduler:
    enabled: true
    type: platform
    name: scheduler
    description: Create and manage scheduled recipe execution
    display_name: Scheduler
    bundled: true
providers:
  openai:
    enabled: true
    model: minimax/MiniMax-M3
    configured: true
  zai:
    enabled: true
    model: glm-5.2
    configured: true
  custom_qwencloud_token_plan:
    enabled: true
    model: qwen3.8-max-preview
    configured: true
  bifrost:
    enabled: true
    model: opencode-go/deepseek-v4-pro
    configured: true
active_provider: bifrost
GOOSE_TELEMETRY_ENABLED: true
GOOSE_THINKING_EFFORT: max
GOOSE_FAST_MODEL: opencode-go/deepseek-v4-flash
