# Devbox service: wigolo HTTP daemon (REST + remote MCP on :3333)
# Started with: devbox services up wigolo
# Stopped with:  devbox services stop wigolo
# Built-in webfetch/websearch route through this daemon — on connection-level webfetch failure, check daemon health (curl localhost:3333/health) before debugging fetch arguments.
#
# Devbox service: open-design local daemon (web UI + REST on :7456)
# Started with: devbox services up open-design   (bare `devbox services up` starts both)
# Stopped with:  devbox services stop open-design
# The opencode MCP entry (mcp.servers.open-design) proxies to this daemon, and the
# vela/AMR runtime needs `vela` on PATH. When every open-design tool answers
# "daemon unreachable", check curl 127.0.0.1:7456/api/health first.
# Run these from a directory holding devbox.json (this repo, or the global profile dir).
#
# Devbox service: podman (rootless Docker-API socket for Cua Spaces)
# Started with: devbox services up podman   (bare `devbox services up` starts it)
# Stopped with:  devbox services stop podman
# The Cua daemon and the Cua Spaces app look for a container engine at
# $XDG_RUNTIME_DIR/podman/podman.sock and find nothing when it is absent: the
# Spaces then fail with "a container engine is not available". The nix podman
# ships no systemd user unit, and this service owns the socket instead.
# The socket directory has to exist before podman binds it, hence the mkdir.
# Only one podman API service may own that socket: two of them fight, and the
# loser stops answering the socket the winner just took over.
#
# Devbox service: cua (the Cua Spaces daemon)
# Started with: devbox services up cua   (bare `devbox services up` starts it)
# Stopped with:  devbox services stop cua
# The Cua Spaces app and the `cua` MCP server both attach to this daemon
# (they reuse one that is already running rather than starting a second).
# `cua daemon start` refuses to run while a daemon is up, so the service waits
# for the incumbent to exit and then takes the daemon over in the foreground.
# It needs the podman socket above to create Spaces, hence the dependency.

version: "0.5"

processes:
  wigolo:
    command: wigolo serve
    environment:
      - "WIGOLO_LLM_PROVIDER=openai"
      # NOTE 2026-10-16: servability-probed 8 Zen candidates via direct
      # chat-completions calls — glm-5.3 picked (flagship reasoning tier, also
      # in budget preset + bifrost failover chain). Also-200: kimi-k3,
      # qwen3.8-max, mimo-v2.6-pro, deepseek-v4.1-flash. 400
      # ModelProtocolUnsupported (native-path only): gpt-6-luna,
      # claude-haiku-5-5, muse-spark-1.3-contributor. Prior: mimo-v2.5.
      - "WIGOLO_LLM_MODEL=glm-5.3-flash"
      # Zen gateway (OpenAI-compatible): alias the Go key as OPENAI_API_KEY.
      # Do NOT let the real OpenAI key leak in here — zen rejects it.
      - "OPENAI_BASE_URL=https://opencode.ai/zen/go/v1"
      - "OPENAI_API_KEY=${OPENCODE_GO_API_KEY}"
      # Zen gateway session routing: x-opencode-session header (uuid mirrors
      # bifrost providers.opencode-go.network_config.extra_headers; rotates
      # per opencode session — refresh from ~/.config/bifrost/config.json).
      - 'WIGOLO_OPENAI_EXTRA_HEADERS={"x-opencode-session":"c5f025e7-1536-4971-a0ca-66976ef8a634"}'
      # Node must not see a foreign libsqlite3 (e.g. shuttle's LD_LIBRARY_PATH);
      # its nix wrapper re-prepends its own playwright deps after this clears it.
      - "LD_LIBRARY_PATH="
      # Small box (13/15Gi RAM used): single browser per self-hosting guidance.
      - "MAX_BROWSERS=1"
      # DeepSeek search is a key-gated engine in the core pools: no backend
      # switch and no plugin are involved. The key normally arrives by
      # inheritance from the devbox secrets cache; declaring it here keeps the
      # service's contract explicit and survives a supervisor restart that
      # does not inherit the cache.
      - "DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}"
      # Reranking runs on Jev through OpenRouter's decisions API instead of the
      # bundled cross-encoder, which parks about 1 GB of native memory once it
      # loads. The key comes from the secrets cache rather than config.json, so
      # the secret has one owner and the service contract survives a supervisor
      # restart that does not inherit the cache.
      #
      # The supervisor fixes `environment` when IT starts, so editing this block
      # and restarting only the service changes nothing. Push the new spec with
      # `process-compose project update -f <this file>`, then restart the service.
      - "WIGOLO_RERANKER=decision"
      - "WIGOLO_RERANKER_BASE_URL=https://openrouter.ai/api/alpha/decisions"
      - "WIGOLO_RERANKER_MODEL=~typesafe/jev-latest"
      - "WIGOLO_RERANKER_API_KEY=${OPENROUTER_API_KEY}"
      # 'auto' lets the browser tier run an installed Chromium. On this host that
      # is Flatpak Chrome or Brave, launched through flatpak's exported command so
      # the browser keeps its sandbox. 'chromium', the default, pins the bundled
      # build and never inspects the host.
      - "WIGOLO_BROWSER_CHANNEL=auto"
    availability:
      restart: "always"

  open-design:
    # --no-open: the wrapper would otherwise launch a browser tab on each start.
    # The wrapper defaults OD_DATA_DIR to ${XDG_STATE_HOME:-$HOME/.local/state}/open-design
    # and creates it; set OD_DATA_DIR here only to move state elsewhere.
    command: open-design --no-open
    disabled: true
    environment:
      - "OD_PORT=7456"
    availability:
      restart: "always"

  podman:
    # The rootless Podman API socket. The Cua daemon and the Cua Spaces app
    # look for a container engine at $XDG_RUNTIME_DIR/podman/podman.sock, and
    # with no socket there every Space fails with "a container engine is not
    # available". The nix podman ships no systemd user unit, so this service
    # owns the socket.
    # The socket directory has to exist before podman binds it, hence the mkdir.
    # Only ONE podman API service may own that socket: a second one takes the
    # path over and the first stops answering it, so bin/setup-podman no
    # longer installs a systemd unit for it.
    command: sh -c 'mkdir -p "$XDG_RUNTIME_DIR/podman" && exec podman system service --time=0 "unix://$XDG_RUNTIME_DIR/podman/podman.sock"'
    availability:
      restart: "always"

  cua:
    # The Cua daemon. The Cua Spaces app and the `cua` MCP server both attach
    # to it, and either starts one of its own when the slot is free.
    # `cua daemon start` refuses to start while a daemon is up, so this
    # service waits for the container engine to answer, then takes the daemon
    # over in the foreground and restarts it when it exits. It needs the
    # podman socket above, hence the dependency.
    command: sh -c 'until podman --remote --url "unix://$XDG_RUNTIME_DIR/podman/podman.sock" version >/dev/null 2>&1; do sleep 3; done; while true; do if cua daemon status >/dev/null 2>&1; then sleep 5; continue; fi; cua daemon start --foreground; sleep 2; done'
    depends_on:
      podman:
        condition: process_started
    availability:
      restart: "always"
