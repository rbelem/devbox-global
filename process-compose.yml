# Devbox service: LiteLLM proxy — 100+ provider gateway with latency-based routing
# Started with: devbox services up litellm
# Stopped with:  devbox services stop litellm

# Devbox service: wigolo HTTP daemon (REST + remote MCP on :3333)
# Started with: devbox services up wigolo
# Stopped with:  devbox services stop wigolo

version: "0.5"

processes:
  litellm:
    command: litellm --config $HOME/.config/litellm/config.yaml --port 4000 --num_workers 1
    availability:
      restart: "always"
  wigolo:
    command: wigolo serve
    environment:
      - "WIGOLO_LLM_PROVIDER=openai"
      - "WIGOLO_LLM_MODEL=${OPENAI_MODEL}"
    availability:
      restart: "always"
